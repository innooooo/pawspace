services:
  postgres:
    image: postgres:15
    container_name: pawspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pawspace
      POSTGRES_USER: pawspace
      POSTGRES_PASSWORD: pawspace
    ports:
      - "5432:5432"
    volumes:
      - pawspace_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/migrations/001_add_comments.sql:/docker-entrypoint-initdb.d/002_add_comments.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/900_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawspace -d pawspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pawspace_postgres_data:
